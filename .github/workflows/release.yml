name: Release to PyPI

# Publishes when a version tag is pushed:
#     git tag v0.0.1 && git push origin v0.0.1
#
# Authentication uses a PyPI API token, matching how django-search-filter-sort
# is published. One-time setup:
#   1. On PyPI, create a project-scoped API token (Account settings -> API
#      tokens). Scope it to `syscon-tts` once the project exists; for the very
#      first upload an account-scoped token is required, and it should be
#      replaced with a project-scoped one afterwards.
#   2. In this repo: Settings -> Secrets and variables -> Actions -> New
#      repository secret, named PYPI_API_TOKEN.
#
# Prefer publishing from here rather than a laptop: the artifact is then built
# from a known-clean checkout of a tagged commit, not from whatever happens to
# be in a working directory. scripts/release.sh covers the local path when
# needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        # Only runs for tag pushes. A tag that disagrees with pyproject
        # publishes a version nobody can find later, and PyPI will not let it
        # be replaced.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          # Tag pushes always go to PyPI; manual runs go wherever asked.
          TARGET: ${{ github.event.inputs.repository || 'pypi' }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN secret is not set (see the comments in this workflow)"
            exit 1
          fi
          python -m pip install --upgrade pip twine
          if [ "$TARGET" = "testpypi" ]; then
            twine upload --repository-url https://test.pypi.org/legacy/ dist/*
          else
            twine upload dist/*
          fi
