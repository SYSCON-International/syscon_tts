name: Release to PyPI

# Publishes when a version tag is pushed:
#     git tag v0.0.5 && git push origin v0.0.5
#
# A manual run (Actions -> Release to PyPI -> Run workflow) publishes to
# TestPyPI only, as a rehearsal. PyPI itself is reachable only from a tag, so
# what lands there is always a tagged commit whose version matches the tag.
#
# Authentication is PyPI Trusted Publishing (OIDC): no API token is stored in
# this repository. One-time setup, done by a PyPI owner of syscon-tts:
#   1. pypi.org -> syscon-tts -> Settings -> Publishing -> Add a GitHub
#      publisher: owner SYSCON-International, repository syscon_tts,
#      workflow release.yml, environment "pypi".
#   2. The same on test.pypi.org, with environment "testpypi".
#   3. In this repo: Settings -> Environments -> create "pypi" (add required
#      reviewers and restrict it to v* tags) and "testpypi".
# Once that works, delete the old PYPI_API_TOKEN secret.
#
# Prefer publishing from here rather than a laptop: the artifact is then built
# from a known-clean checkout of a tested, tagged commit. create_dist.sh and
# upload_dist.sh cover the local path when needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # The full CI matrix, run against exactly the commit being released.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with the package publishes a version nobody can
        # find later, and PyPI will not let it be replaced. The version is now
        # single-sourced in _version.py (pyproject has `dynamic = ["version"]`,
        # so reading [project].version here raised KeyError and blocked every
        # release).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from syscon_tts._version import __version__; print(__version__)")
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match syscon_tts.__version__ $VERSION"
            exit 1
          fi

      - name: Verify the version is newer than the newest release on PyPI
        # The guard is "strictly newer than anything live", not merely "not this
        # exact version" -- otherwise a stale or re-cut tag could republish an
        # older line. CI green on this commit is already enforced by `needs:
        # test` (the publish jobs need build, build needs test).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import sys, urllib.error, urllib.request, json
          sys.path.insert(0, "src")
          from syscon_tts._version import __version__ as me

          def parse(v):
              return tuple(int(p) for p in v.split(".") if p.isdigit())

          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/syscon-tts/json", timeout=30
              ) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("syscon-tts has no releases yet; any version is newer.")
                  sys.exit(0)
              raise
          live = [
              v for v, files in data["releases"].items()
              if files and not all(f.get("yanked") for f in files)
          ]
          newest = max(live, key=parse) if live else None
          print(f"this={me} newest_live={newest}")
          if newest is not None and parse(me) <= parse(newest):
              sys.exit(f"::error::{me} is not newer than the newest live release {newest}.")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/syscon-tts/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/syscon-tts/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
