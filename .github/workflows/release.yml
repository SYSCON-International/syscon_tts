name: Release to PyPI

# Publishes when a version tag is pushed:
#     git tag v1.0.0 && git push origin v1.0.0
#
# Uses PyPI Trusted Publishing (OIDC) -- there is no API token to store or
# rotate. One-time setup on PyPI, under the project's Publishing settings:
#     Owner:            SYSCON-International
#     Repository:       syscon_tts
#     Workflow:         release.yml
#     Environment:      pypi
# For the very first upload, create a "pending publisher" with the same values
# before the project exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with pyproject publishes a version nobody can
        # find later, and PyPI will not let it be replaced.
        run: |
          python -m pip install --upgrade pip
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
