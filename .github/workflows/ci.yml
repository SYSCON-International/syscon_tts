name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this before it builds anything, so a tag is only ever
  # published from a commit that passed the full matrix in that same run.
  workflow_call:

# Third-party actions are pinned by commit SHA; the trailing comment records
# the release it corresponds to. Bump both together.
jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target, so it carries the supported
        # interpreter range -- including 3.12, where the dependency marker
        # deliberately skips Piper. Windows and macOS are developer machines:
        # they are here to prove the package installs and imports with Piper
        # absent, which is the whole cross-platform contract.
        include:
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # No extras juggling per platform: the piper-tts marker in pyproject
        # resolves it on Linux and skips it elsewhere. If this step fails on
        # Windows or macOS, the marker has regressed.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm Piper presence matches the platform
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from syscon_tts import piper_available
          expected = sys.platform.startswith("linux") and sys.version_info < (3, 12)
          actual = piper_available()
          print(f"platform={sys.platform} expected_piper={expected} actual={actual}")
          if expected != actual:
              raise SystemExit(
                  f"Piper availability {actual} does not match the dependency "
                  f"marker's intent {expected} for this platform."
              )
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        # With no models installed, doctor must report the host unprovisioned
        # and exit 1 -- exit 0 here would mean the provisioning gate is broken.
        shell: bash
        env:
          SYSCON_TTS_VOICES_DIR: ${{ runner.temp }}/voices
        run: |
          set +e
          syscon-tts doctor > doctor.out 2> doctor.err
          rc=$?
          set -e
          cat doctor.out doctor.err
          test "$rc" -eq 1 || { echo "::error::doctor exited $rc, expected 1"; exit 1; }
          grep -q "voices installed  0/" doctor.out
          grep -q "download-voices" doctor.err

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip "ruff>=0.6,<1.0"
          ruff check src tests

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*
      - name: Smoke-test the built wheel
        # The suite runs against `pip install -e`, so a wheel that is missing
        # voices.json, a module, or the console entry point can still build
        # green (it has). Install the wheel into a clean venv -- NOT the source
        # tree -- and exercise the packaged artifact.
        run: |
          python -m venv /tmp/wheelenv
          wheel=$(ls dist/*.whl)
          /tmp/wheelenv/bin/pip install "$wheel"
          # Run from / so a stray ./syscon_tts cannot shadow the installed one.
          cd /
          # Packaged version must be the single-sourced one, not 0.0.0 or empty.
          /tmp/wheelenv/bin/syscon-tts --version | grep -Eq 'syscon-tts [0-9]+\.[0-9]+\.[0-9]+'
          # voices.json must be inside the wheel (it has shipped missing before).
          /tmp/wheelenv/bin/syscon-tts list-voices | grep -q en_us_kristin

  synthesis:
    name: Real Piper synthesis (linux / py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install with the real engine
        # Every unit test fakes piper and onnxruntime, so the hand-copied
        # PiperVoice.load path and the floating onnxruntime are never actually
        # exercised. This job runs the real thing end to end.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[piper]"
      - name: Download one voice and synthesize
        env:
          SYSCON_TTS_VOICES_DIR: ${{ runner.temp }}/voices
          SYSCON_TTS_ALERTS_DIR: ${{ runner.temp }}/alerts
        run: |
          syscon-tts download-voices en_us_kristin
          syscon-tts doctor --language en-us
          syscon-tts speak -v en_us_kristin -o "${{ runner.temp }}/hi.wav" "Machine four fault detected."
          # A real WAV, non-trivial size.
          python - <<'PY'
          import os, wave
          path = os.path.join(os.environ["RUNNER_TEMP"], "hi.wav")
          with wave.open(path, "rb") as w:
              frames = w.getnframes()
          assert frames > 1000, f"suspiciously short audio: {frames} frames"
          print(f"synthesized {frames} frames OK")
          PY
      - name: espeak-ng crash vectors do not take the process down
        # The pinned espeak-ng can segfault on crafted text; syscon_tts isolates
        # synthesis in a worker so that surfaces as SynthesisError. Exercise the
        # isolation against real Piper. (Add captured crash strings here as they
        # are collected; the worker self-test proves the mechanism meanwhile.)
        env:
          SYSCON_TTS_VOICES_DIR: ${{ runner.temp }}/voices
        run: pytest -q tests/test_worker.py
