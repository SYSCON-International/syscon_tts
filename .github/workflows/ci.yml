name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target, so it carries the supported
        # interpreter range. Windows and macOS are developer machines: they are
        # here to prove the package installs and imports with Piper absent,
        # which is the whole cross-platform contract.
        include:
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # No extras juggling per platform: the piper-tts marker in pyproject
        # resolves it on Linux and skips it elsewhere. If this step fails on
        # Windows or macOS, the marker has regressed.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm Piper presence matches the platform
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from syscon_tts import piper_available
          expected = sys.platform.startswith("linux") and sys.version_info < (3, 12)
          actual = piper_available()
          print(f"platform={sys.platform} expected_piper={expected} actual={actual}")
          if expected != actual:
              raise SystemExit(
                  f"Piper availability {actual} does not match the dependency "
                  f"marker's intent {expected} for this platform."
              )
          PY

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI
        # doctor exits non-zero when no models are installed, which is the
        # expected state in CI; we only care that it runs and reports.
        run: syscon-tts doctor || true

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata renders on PyPI
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
