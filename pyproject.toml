[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syscon-tts"
# Single-sourced from src/syscon_tts/_version.py; see [tool.setuptools.dynamic]
# below. Do not add a static version here -- that reintroduces the two-places
# drift that shipped 0.1.0 reporting 0.0.4.
dynamic = ["version"]
description = "Offline neural text-to-speech for the PlantStar APU"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
# Split across two entries so the metadata renders as separate `Author` and
# `Author-email` fields, matching django-search-filter-sort. A single entry
# with both keys would collapse into `Author-email: Name <addr>` instead.
authors = [
    { name = "Keith Hostetler" },
    { email = "robh@syscon-intl.com" },
]
keywords = ["tts", "text-to-speech", "piper", "offline", "plantstar", "apu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Piper is installed on Linux only. piper-phonemize 1.1.0 publishes
# manylinux_2_28 wheels for x86_64 and aarch64 (Python 3.9-3.11) and no sdist,
# so the marker also pins the architecture (exact `==` matches, not a substring
# `in` test): without it, pip on 32-bit ARM, i686, ppc64le, etc. tries to build
# from an sdist that does not exist and `pip install syscon-tts` fails outright.
#
# A marker CANNOT express the libc, so two cases still MATCH this marker yet
# cannot install the wheel: musl (Alpine) and glibc < 2.28 (pre-RHEL/CentOS 8,
# pre-Debian 10, pre-Ubuntu 18.10). On those hosts `pip install syscon-tts`
# fails; install the engine-free package with `pip install --no-deps
# syscon-tts` (it still resolves, inspects, and replays previously generated
# audio -- it just cannot synthesize). On every non-Linux platform the package
# installs cleanly without Piper. Run `syscon-tts doctor` after installing to
# confirm which mode you landed in.
#
# LICENCE: do not bump piper-tts past 1.2.x without legal review.
#   * piper-tts 1.2.0 is MIT, but its piper-phonemize dependency bundles
#     espeak-ng, which is GPL-3.0.
#   * piper-tts >= 1.3 moved to OHF-voice/piper1-gpl and is GPL-3.0-or-later.
# This package ships on customer hardware, so either change is a distribution
# question, not a routine upgrade. tests/test_config.py fails if the pin
# moves. See README, "Engine licensing".
dependencies = [
    "piper-tts==1.2.0; sys_platform == 'linux' and python_version < '3.12' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[project.optional-dependencies]
# Force the synthesis engine regardless of the marker above. Fails loudly on a
# platform Piper cannot support, which is what you want when the install is
# meant to produce audio.
piper = ["piper-tts==1.2.0"]
# The optional HTTP server. Not needed by the APU, which imports the library.
server = ["fastapi>=0.111,<1.0", "uvicorn[standard]>=0.30,<1.0"]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.urls]
Homepage = "https://github.com/SYSCON-International/syscon_tts"
Source = "https://github.com/SYSCON-International/syscon_tts"
Issues = "https://github.com/SYSCON-International/syscon_tts/issues"

[project.scripts]
syscon-tts = "syscon_tts.cli:main"

[tool.setuptools.dynamic]
# The version is read from the module literal at build time, so the wheel's
# metadata and `syscon_tts.__version__` are always the same number.
version = { attr = "syscon_tts._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The voice manifest travels inside the wheel; the models it points at are
# downloaded at provisioning time (they are far too large to ship).
syscon_tts = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # keep typing.Optional/List: 3.9 is supported
    "B008",                    # dataclass field(default_factory=...) idiom
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
