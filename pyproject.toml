[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantstar-tts"
version = "1.0.0"
description = "Offline text-to-speech service for the PlantStar APU server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "piper-tts==1.2.0",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
]

[project.scripts]
plantstar-tts = "plantstar_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
